name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'linux'
      - 'macos'
      - 'windows'
  workflow_dispatch:

env:
  RUST_VERSION: nightly

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os || 'ubuntu-22.04' }}
    strategy:
      matrix:
        platform:
          # Linux - musl only (static libc, works everywhere)
          - name: Linux x86_64 Headless
            target: x86_64-unknown-linux-musl
            build-args: "--release --bin dure-desktop --no-default-features"

          - name: Linux x86_64 GUI
            target: x86_64-unknown-linux-musl
            build-args: "--release --bin dure-desktop"

          # Note: aarch64 build disabled - requires cross-compiler (aarch64-linux-musl-gcc)
          # TODO: Re-enable when cross-compilation toolchain is configured

          # macOS
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            build-args: "--release --bin dure-desktop"

          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            build-args: "--release --bin dure-desktop"

          # Windows
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            build-args: "--release --bin dure-desktop"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.platform.target }}

      - name: Linux - Install musl tools
        if: contains(matrix.platform.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Linux GUI - Install dependencies
        if: contains(matrix.platform.name, 'GUI') && contains(matrix.platform.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libwayland-dev libcairo2-dev libpango1.0-dev golang-go

      - name: Windows - Install OpenSSL
        if: contains(matrix.platform.target, 'windows')
        run: |
          vcpkg install openssl:x64-windows-static-md
          vcpkg integrate install

      - name: Build binary for ${{ matrix.platform.name }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          VCPKG_ROOT: ${{ contains(matrix.platform.target, 'windows') && 'C:\vcpkg' || '' }}
        working-directory: mobile
        run: cargo build ${{ matrix.platform.build-args }} --target ${{ matrix.platform.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact-staging

          # Determine binary name and path
          if [[ "${{ matrix.platform.target }}" == *"windows"* ]]; then
            BINARY_NAME="dure-desktop.exe"
            BINARY_PATH="target/${{ matrix.platform.target }}/release/dure-desktop.exe"
          else
            BINARY_NAME="dure-desktop"
            BINARY_PATH="target/${{ matrix.platform.target }}/release/dure-desktop"
          fi

          # Copy binary
          cp "$BINARY_PATH" "artifact-staging/$BINARY_NAME"

          # Generate checksum
          cd artifact-staging
          if [[ "${{ matrix.platform.target }}" == *"windows"* ]]; then
            sha256sum "$BINARY_NAME" > "$BINARY_NAME.sha256"
          else
            sha256sum "$BINARY_NAME" > "$BINARY_NAME.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dure-desktop-${{ matrix.platform.target }}${{ contains(matrix.platform.name, 'Headless') && '-headless' || '' }}
          path: artifact-staging/*
          retention-days: 1

  release:
    name: Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release artifacts
        run: |
          mkdir -p distbin/

          # Copy all artifacts to distbin
          for dir in ./artifacts/dure-desktop-*/; do
            if [ -d "$dir" ]; then
              cp -v "$dir"/* distbin/ 2>/dev/null || true
            fi
          done

          # List what we have
          echo "=== Release artifacts ==="
          ls -lh distbin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          make_latest: true
          files: distbin/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
