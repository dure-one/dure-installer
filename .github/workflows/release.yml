name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'linux'
      - 'macos'
      - 'windows'
  workflow_dispatch:

env:
  RUST_VERSION: nightly

jobs:
  build-linux:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/linux' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        platform:
          - name: Linux x86_64 Headless
            target: x86_64-unknown-linux-musl
            build-args: "--release --bin dure-desktop --no-default-features"
            rustflags: "-C link-arg=-lm"

          - name: Linux x86_64 GUI
            target: x86_64-unknown-linux-musl
            build-args: "--release --bin dure-desktop"
            rustflags: "-C target-feature=-crt-static -C link-arg=-lm"

          - name: Linux aarch64 Headless
            target: aarch64-unknown-linux-musl
            build-args: "--release --bin dure-desktop --no-default-features"
            # Repeat libc/libm/libpthread/libdl at tail to fix link ordering:
            # Rust places libc.a before C build-script archives (sqlite3mc), so
            # SQLite's refs to strcat/pthread/log/dlerror go unresolved without these.
            rustflags: "-C link-arg=-lm -C link-arg=-lpthread -C link-arg=-ldl -C link-arg=-lc"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install musl tools (x86_64)
        if: matrix.platform.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Download aarch64-linux-musl toolchain
        if: matrix.platform.target == 'aarch64-unknown-linux-musl'
        run: |
          # Mirror: https://github.com/troglobit/misc/releases/download/11-20211120/
          # Available toolchains (add here when needed):
          #   aarch64-linux-musl-cross.tgz
          #   x86_64-linux-musl-cross.tgz
          #   i686-linux-musl-cross.tgz
          #   musl-cross.sha512  (checksums)
          wget -q https://github.com/troglobit/misc/releases/download/11-20211120/aarch64-linux-musl-cross.tgz
          tar -xzf aarch64-linux-musl-cross.tgz -C "$HOME"
          echo "$HOME/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=$HOME/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc" >> "$GITHUB_ENV"

      - name: Install GUI dependencies
        if: contains(matrix.platform.name, 'GUI')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libwayland-dev libcairo2-dev libpango1.0-dev golang-go

      - name: Build binary for ${{ matrix.platform.name }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER }}
        working-directory: mobile
        run: cargo build ${{ matrix.platform.build-args }} --target ${{ matrix.platform.target }}

      - name: Prepare artifact
        run: |
          mkdir -p artifact-staging
          cp "target/${{ matrix.platform.target }}/release/dure-desktop" "artifact-staging/dure-desktop"
          cd artifact-staging
          sha256sum dure-desktop > dure-desktop.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dure-desktop-${{ matrix.platform.target }}${{ contains(matrix.platform.name, 'Headless') && '-headless' || '' }}
          path: artifact-staging/*
          retention-days: 1

  build-macos:
    name: Build - ${{ matrix.platform.name }}
    runs-on: macos-latest
    if: github.ref == 'refs/heads/macos' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        platform:
          - name: macOS x86_64
            target: x86_64-apple-darwin
            build-args: "--release --bin dure-desktop"

          - name: macOS aarch64
            target: aarch64-apple-darwin
            build-args: "--release --bin dure-desktop"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build binary for ${{ matrix.platform.name }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        working-directory: mobile
        run: cargo build ${{ matrix.platform.build-args }} --target ${{ matrix.platform.target }}

      - name: Prepare artifact
        run: |
          mkdir -p artifact-staging
          cp "target/${{ matrix.platform.target }}/release/dure-desktop" "artifact-staging/dure-desktop"
          cd artifact-staging
          shasum -a 256 dure-desktop > dure-desktop.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dure-desktop-${{ matrix.platform.target }}
          path: artifact-staging/*
          retention-days: 1

  build-windows:
    name: Build - Windows x86_64
    runs-on: windows-latest
    if: github.ref == 'refs/heads/windows' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install OpenSSL
        run: |
          vcpkg install openssl:x64-windows-static-md
          vcpkg integrate install

      - name: Build binary
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          VCPKG_ROOT: C:\vcpkg
        working-directory: mobile
        run: cargo build --release --bin dure-desktop --target x86_64-pc-windows-msvc

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact-staging
          cp "target/x86_64-pc-windows-msvc/release/dure-desktop.exe" "artifact-staging/dure-desktop.exe"
          cd artifact-staging
          sha256sum dure-desktop.exe > dure-desktop.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dure-desktop-x86_64-pc-windows-msvc
          path: artifact-staging/*
          retention-days: 1

  release:
    name: Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release artifacts
        run: |
          mkdir -p distbin/

          # Copy all artifacts to distbin
          for dir in ./artifacts/dure-desktop-*/; do
            if [ -d "$dir" ]; then
              cp -v "$dir"/* distbin/ 2>/dev/null || true
            fi
          done

          # List what we have
          echo "=== Release artifacts ==="
          ls -lh distbin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          make_latest: true
          files: distbin/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
