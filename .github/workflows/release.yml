name: Build Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'linux'
      - 'macos'
      - 'windows'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/linux' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        variant: [gui, headless]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # For vendored OpenSSL build (statically linked, no runtime deps)
          sudo apt-get install -y pkg-config libssl-dev perl make

      - name: Install GUI dependencies
        if: matrix.variant == 'gui'
        run: |
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev golang-go

      - name: Build GUI release binary
        if: matrix.variant == 'gui'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          cd mobile
          cargo build --release --bin dure-desktop

      - name: Build headless release binary
        if: matrix.variant == 'headless'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          cd mobile
          cargo build --release --bin dure-desktop --no-default-features

      - name: Prepare GUI artifact
        if: matrix.variant == 'gui'
        run: |
          mkdir -p artifact-staging
          cp target/release/dure-desktop artifact-staging/dure-desktop
          cd artifact-staging
          sha256sum dure-desktop > dure-desktop-linux.sha256

      - name: Prepare headless artifact
        if: matrix.variant == 'headless'
        run: |
          mkdir -p artifact-staging
          cp target/release/dure-desktop artifact-staging/dure-desktop-headless
          cd artifact-staging
          sha256sum dure-desktop-headless > dure-desktop-linux-headless.sha256

      - name: Upload GUI artifact
        if: matrix.variant == 'gui'
        uses: actions/upload-artifact@v4
        with:
          name: dure-desktop-linux
          path: artifact-staging/*
          if-no-files-found: error

      - name: Upload headless artifact
        if: matrix.variant == 'headless'
        uses: actions/upload-artifact@v4
        with:
          name: dure-desktop-linux-headless
          path: artifact-staging/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/windows' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenSSL via vcpkg
        run: |
          vcpkg install openssl:x64-windows-static-md
          vcpkg integrate install

      - name: Build release binary
        env:
          # OAuth credentials from GitHub Secrets
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # Use vcpkg for OpenSSL
          VCPKG_ROOT: C:\vcpkg
        run: |
          cd mobile
          cargo build --release --bin dure-desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dure-desktop-windows
          path: target/release/dure-desktop.exe

  build-macos:
    runs-on: macos-latest
    if: github.ref == 'refs/heads/macos' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        env:
          # OAuth credentials from GitHub Secrets
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          cd mobile
          cargo build --release --bin dure-desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dure-desktop-macos
          path: target/release/dure-desktop

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dure-desktop-linux/dure-desktop
            dure-desktop-linux/dure-desktop-linux.sha256
            dure-desktop-linux-headless/dure-desktop-headless
            dure-desktop-linux-headless/dure-desktop-linux-headless.sha256
            dure-desktop-windows/dure-desktop.exe
            dure-desktop-macos/dure-desktop
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
