[workspace]
resolver = "2"
members = [
    "mobile",
    "crates/windows-installer",
    "crates/ws",
    "crates/chat",
    "crates/netwatch-stub",
]
exclude = [
    "reference/deltachat-core",  # Excluded: has its own workspace
]

# OpenBSD compatibility: Replace netwatch with stub implementation
# This allows DeltaChat to compile on OpenBSD despite netwatch not supporting
# OpenBSD's PF_ROUTE sockets. The stub provides API compatibility but no
# actual network monitoring - users must manually reconnect after network changes.
[patch.crates-io]
netwatch = { path = "crates/netwatch-stub" }

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikescar/dure"
rust-version = "1.85"
version = "0.0.1"
readme = "README.md"

# rusqlite 0.38 compatibility: Enable fallible_uint feature
# Rusqlite 0.38 moved u64/usize support behind the fallible_uint feature flag.
# DeltaChat uses these types extensively for database IDs.
[workspace.dependencies]
rusqlite = { version = "0.38", features = ["fallible_uint"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
# Fast incremental builds for development
opt-level = 0
debug = 2
lto = false
incremental = true
codegen-units = 256

[profile.release]
lto = true # "fat"
codegen-units = 1
opt-level = "z"
debug = 0
strip = "symbols"
panic = "abort"

# Fast development profile - optimized but without slow LTO
[profile.dev-release]
inherits = "release"
lto = false           # Disable LTO for faster builds (saves 50%+ compile time)
codegen-units = 16    # Parallel code generation
opt-level = 2         # Good optimization without being too slow
incremental = true    # Enable incremental compilation
strip = "symbols"     # Still strip symbols to reduce size

